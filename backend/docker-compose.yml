services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  celery_worker:
    build: .
    env_file:
      - .env
    environment:
      # The Docker daemon (reached via the mounted socket below) resolves
      # bind-mount sources against the *host* filesystem, not this
      # container's - these must point at the real host paths backing the
      # bind mounts two lines down. See settings.py's docstring.
      EXECUTION_HOST_WORK_ROOT: ${PWD}/data/executions
      TENSORBOARD_HOST_LOG_ROOT: ${PWD}/data/tensorboard_logs
    command: celery -A app.config.celery_config.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      mlflow:
        condition: service_started
    volumes:
      - .:/app
      - ${PWD}/data/executions:/tmp/research2code/executions
      - ${PWD}/data/tensorboard_logs:/tmp/research2code/tensorboard_logs
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      # `celery inspect ping` broadcasts over the broker and succeeds if *any*
      # connected worker replies - a coarse signal, but exec-form CMD can't do
      # shell expansion to target only this container's own worker, and this
      # is still enough to catch "the whole worker fleet is down".
      test: ["CMD", "celery", "-A", "app.config.celery_config.celery_app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-research2code}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpassword}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # NOTE: the "research2code" MinIO bucket must exist before MLflow can write
  # artifacts to it. The api/celery_worker services create it lazily on their
  # first MinIO operation (see app/storage/minio_client.py) - on a totally
  # fresh `docker compose up`, trigger any paper upload (or just let the api
  # service start and hit /health) before running an execution that logs
  # artifacts, or pre-create the bucket manually (e.g. via `mc mb`).
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    command: >
      mlflow server
      --host 0.0.0.0
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://${MINIO_BUCKET:-research2code}/mlflow-artifacts
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    depends_on:
      minio:
        condition: service_healthy
    restart: unless-stopped

  tensorboard:
    image: tensorflow/tensorflow:2.16.1
    command: ["tensorboard", "--logdir", "/logs", "--host", "0.0.0.0", "--reload_multifile=true"]
    ports:
      - "6006:6006"
    volumes:
      - ${PWD}/data/tensorboard_logs:/logs
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  neo4j_data:
  mlflow_data:
